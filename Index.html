    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa da Geladeira</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --gray: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: var(--text);
        }

        .subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .image-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-card {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-tag {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        .timer {
            font-size: 0.9rem;
            color: var(--text);
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 8px;
            margin-bottom: 30px;
        }

        .number {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .number:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .number.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .number.sold {
            background: #fee2e2;
            color: #ef4444;
            cursor: not-allowed;
            opacity: 0.7;
            text-decoration: line-through;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 1rem;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-pix {
            background: var(--primary);
            color: white;
        }

        .btn-card {
            background: var(--success);
            color: white;
        }

        @media (max-width: 400px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
<style>html,body{overscroll-behavior:contain}canvas{max-width:100%;height:auto}img{max-width:100%}</style></head>
<body>

<div class="container">
    <h1>Rifa da Geladeira</h1>
    <p class="subtitle">Garanta seu número e concorra!</p>

    <div class="image-wrapper">
        <img src="9e02ab2db316254b0338317cebd31cab.jpg" alt="Geladeira Prêmio">
    </div>

    <div class="info-card">
        <div>
            <span style="display:block; font-size:0.8rem; color:var(--gray)">Valor da cota</span>
            <span class="price-tag">R$ 10,00</span>
        </div>
        <div style="text-align: right;">
            <span style="display:block; font-size:0.8rem; color:var(--gray)">Encerra em</span>
            <span class="timer" id="countdown">...</span>
        </div>
    </div>

    <div class="grid" id="numeros"></div>

    <div class="actions">
        <button class="btn btn-pix" onclick="pagar('PIX')">Pagar com PIX</button>
        <button class="btn btn-card" onclick="pagar('Cartão')">Pagar com Cartão</button>
    </div>
</div>

<script>
    const totalNumeros = 100;
    // Simulação de vendidos
    const vendidos = [5, 12, 45, 88, 99]; 
    let selecionado = null;

    const grid = document.getElementById('numeros');

    for (let i = 1; i <= totalNumeros; i++) {
        const div = document.createElement('div');
        div.className = 'number';
        div.innerText = i;

        if (vendidos.includes(i)) {
            div.classList.add('sold');
        } else {
            div.onclick = () => {
                // Remove seleção anterior
                document.querySelectorAll('.number.selected').forEach(el => el.classList.remove('selected'));
                
                // Seleciona novo
                div.classList.add('selected');
                selecionado = i;
            };
        }
        grid.appendChild(div);
    }

    function pagar(metodo) {
        if (!selecionado) {
            alert('Selecione um número primeiro!');
            return;
        }
        alert(`Número ${selecionado} reservado.\nPagamento via ${metodo} iniciado.`);
    }

    // Countdown
    const fim = new Date();
    fim.setDate(fim.getDate() + 90);

    setInterval(() => {
        const agora = new Date();
        const diff = fim - agora;
        const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = `${dias} dias`;
    }, 1000);
</script>

<script>(function(){function pick(){var c=[];var r=document.getElementById('root');if(r&&r.firstElementChild)c.push(r.firstElementChild);if(r)c.push(r);var b=document.body;if(b&&b.firstElementChild)c.push(b.firstElementChild);if(b)c.push(b);for(var i=0;i<c.length;i++){try{var g=getComputedStyle(c[i]).backgroundColor;if(g&&g!=='rgba(0, 0, 0, 0)'&&g!=='transparent')return g;}catch(e){}}return null;}function sync(){var g=pick();if(g){document.documentElement.style.background=g;document.body.style.background=g;try{parent.postMessage({__bg:{picked:g}},'*');}catch(e){}}}window.addEventListener('load',sync);document.addEventListener('DOMContentLoaded',sync);var n=0,t=setInterval(function(){sync();if(++n>12)clearInterval(t);},200);})();</script></body>
</html>
